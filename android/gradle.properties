# Gradle 构建参数（内存、增量、并行等），与 ferry-bot-android / video_browser 保持一致
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Flutter 工具链对 configuration cache 支持不完整，这里先不开（其余项目已开）
# org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=google
# Kotlin 编译放在 Gradle 进程内：少起一个 daemon，构建更快
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# Flutter 3.44 模板要求：AGP 9 关闭新 DSL 与内置 Kotlin，继续使用 KGP 2.3.10
android.newDsl=false
android.builtInKotlin=false

# App 只支持 arm64-v8a（libmpv/libass 只有该 ABI）。Flutter 默认会把
# abiFilters 重置成 [armeabi-v7a, arm64-v8a, x86_64]，导致插件自带的
# 其它 ABI 预编译 .so 被打进包里（实测多出 ~56MB）。关掉它，改由
# app/build.gradle.kts 的 abiFilters = arm64-v8a 决定。
disable-abi-filtering=true
