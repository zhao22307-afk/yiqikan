name: yiqikan
description: "一起看 —— 完全本地化、装完即用的双机同步观影应用（本机内置服务）"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # G1 多语言：delegate 来自 flutter_localizations，intl 的版本交给它约束（不写死）
  flutter_localizations:
    sdk: flutter

  # ---- 状态管理 / 路由 ----
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  # ---- 播放内核（libmpv，见 03 §1.3.3 预置 jar）----
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  fvp: ^0.39.1
  video_player: ^2.14.1

  # ---- 实时音视频（M8 语音 / 屏幕共享，提供 libjingle_peerconnection_so.so）----
  flutter_webrtc: ^1.6.3

  # ---- 本地存储 ----
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.6
  path: ^1.9.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # ---- 网络（只连本机 / 局域网）----
  dio: ^5.7.0
  # HTML 型片源解析（此前只是 inappwebview 的传递依赖，这里显式声明，版本随 lock 的 0.15.7）
  html: ^0.15.7
  dio_cookie_manager: ^3.1.1
  web_socket_channel: ^3.0.1
  dartssh2: ^4.1.0
  # 稳定线 6.1.5 的 android 子包在 AGP 9 下配置期硬失败（getDefaultProguardFile('proguard-android.txt'）已移除），
  # 升到 6.2.0-beta.3：唯一在 android/build.gradle 里改用 proguard-android-optimize.txt 的分支。
  flutter_inappwebview: ^6.2.0-beta.3

  # ---- 扫码 / 选文件 / 缩略图 ----
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  file_picker: ^13.3.2

  # ---- 加密 / 设备信息 ----
  crypto: ^3.0.8
  pointycastle: ^4.0.0
  cryptography: ^2.7.0
  audio_session: ^0.1.21
  device_info_plus: ^13.0.0
  package_info_plus: ^10.1.0

  # ---- 播放期设备控制 ----
  wakelock_plus: ^1.8.2
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1

  # ---- 系统能力 ----
  share_plus: ^13.0.0
  url_launcher: ^6.3.0
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.3.3

  # ---- UI ----
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # ---- 模型 / 工具 ----
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.18.0
  intl: any
  uuid: ^4.5.1
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.1
  # riverpod_generator 已在 M4 收口时移除：它依赖的 analyzer 3.9 认不出 Dart 3.12
  # 的点简写语法，会在 build_runner 里抛 Missing implementation of
  # visitDotShorthandInvocation 并把整个生成卡死；本项目没有用 @riverpod 注解，
  # 所有 provider 都是手写 Provider(...)，去掉它不影响功能。
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # G1：l10n.yaml 驱动 gen-l10n，产物落在 lib/l10n/gen/（不用 synthetic package）
  generate: true

  # Anime4K 的 9 个 GLSL（原包 assets/shaders 原样搬来，见 04 §12.1）
  assets:
    - assets/shaders/
    # D22 验收页（yqk://local）：长页面 + 视频，只为测播放/拖动/滚动同步，不是产品页
    - assets/web/
    # TVBox 内置配置（同一份也放在 android/app/src/main/assets/tvbox/ 给 Java 侧读）
    - assets/tvbox/


# ---- M0 依赖偏差记录（详见交付说明）----
# 1) flutter_inappwebview: 文档给 ^6.1.5（稳定线），其 android 子包 1.1.3 在 AGP 9 下配置期硬失败
#    （build.gradle 里 getDefaultProguardFile('proguard-android.txt') 已被 AGP 9 移除），
#    升到 ^6.2.0-beta.3（唯一改用 proguard-android-optimize.txt 的分支）。
# 2) video_thumbnail: 文档给 ^0.5.3，0.5.6 的 android/build.gradle 仍是 jcenter() + compileSdk 33，
#    Gradle 9 已删除 jcenter()。M0 先不引入，M5 做本地缩略图时用 MediaMetadataRetriever + 自建 MethodChannel。
# 3) battery_plus: 文档给 ^6.0.3，其 upower -> dbus ^0.7.0 与 wakelock_plus 1.8.2 的 dbus ^0.8.0 死锁，
#    且 win32 也无法同时满足；M0 不引入，电量显示在播放页用 BatteryManager MethodChannel 自行实现。
# 4) device_info_plus 10.1.2 / share_plus 10.0.2 / volume_controller 2.0.7 与当前插件生态或 AGP 9 冲突，
#    分别升到 ^13.0.0 / ^13.0.0 / ^3.7.1（这三个在文档里没有 ✅ 实测标记）。
